
name: CloudPipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pipewright-ecs-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t cloudpipeline-app:${{ github.sha }} .

  check-aws-auth:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::349326897252:role/pipewright-github-deploy
          aws-region: eu-central-1
          allowed-account-ids: '349326897252'
          role-session-name: CloudPipelineECRPush
          retry-max-attempts: 2

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: pipewright-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Register new ECS task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/pipewright-app:$IMAGE_TAG"

          aws ecs describe-task-definition \
            --task-definition "$(aws ecs describe-services \
              --cluster pipewright-cluster \
              --services pipewright-app \
              --query 'services[0].taskDefinition' \
              --output text)" \
            --query taskDefinition \
            --output json |
          jq --arg IMAGE "$IMAGE" \
            '{
              family,
              executionRoleArn,
              taskRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform
            } | with_entries(select(.value != null)) |
            .containerDefinitions[0].image = $IMAGE' \
            > task-definition-new.json


          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered task definition: $NEW_TASK_DEF_ARN"
          echo "TASK_DEFINITION_ARN=$NEW_TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster pipewright-cluster \
            --service pipewright-app \
            --task-definition "$TASK_DEFINITION_ARN" \
            --desired-count 0 \
            --query 'service.{TaskDefinition:taskDefinition,Desired:desiredCount}'

  deployment-test:
    needs: check-aws-auth
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::349326897252:role/pipewright-github-deploy
          aws-region: eu-central-1
          allowed-account-ids: '349326897252'
          role-session-name: CloudPipelineDeploymentTest

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Inspect ECS service
        run: |
          aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].{Status:status,TaskDefinition:taskDefinition,Desired:desiredCount,Running:runningCount,Pending:pendingCount}'

      - name: Check ECS is stopped before testing
        run: |
          COUNTS=$(aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].[desiredCount,runningCount,pendingCount]' \
            --output text)

          if [ "$COUNTS" != "$(printf '0\t0\t0')" ]; then
            echo "ERROR: ECS service is not fully stopped."
            echo "Current counts: $COUNTS"
            exit 1
          fi

          echo "Preflight passed: ECS service is stopped."

      - name: Verify deployed image matches this commit
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].taskDefinition' \
            --output text)

          IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)

          echo "Service image: $IMAGE"

          case "$IMAGE" in
            *":$GITHUB_SHA") echo "Correct commit image confirmed." ;;
            *) echo "ERROR: ECS image does not match this commit."; exit 1 ;;
          esac

      - name: Start one Fargate task
        id: start_fargate
        run: |
          aws ecs update-service \
            --cluster pipewright-cluster \
            --service pipewright-app \
            --desired-count 1 \
            --query 'service.{Desired:desiredCount,TaskDefinition:taskDefinition}'

      - name: Wait for ECS service stability
        timeout-minutes: 10
        run: |
          aws ecs wait services-stable \
            --cluster pipewright-cluster \
            --services pipewright-app

      - name: Find running ECS task
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster pipewright-cluster \
            --service-name pipewright-app \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ERROR: No running ECS task found"
            exit 1
          fi

          echo "Running ECS task: $TASK_ARN"
          echo "TASK_ARN=$TASK_ARN" >> "$GITHUB_ENV"

      - name: Find Fargate public IP
        run: |
          ENI_ID=$(aws ecs describe-tasks \
            --cluster pipewright-cluster \
            --tasks "$TASK_ARN" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
            --output text)

          if [ -z "$ENI_ID" ] || [ "$ENI_ID" = "None" ]; then
            echo "ERROR: No network interface found"
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "ERROR: No public IP found"
            exit 1
          fi

          echo "Public IP: $PUBLIC_IP"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Smoke test application health
        timeout-minutes: 2
        run: |
          echo "Testing application at http://$PUBLIC_IP:3000/health"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --max-time 10 \
            --retry 3 \
            --retry-delay 2 \
            "http://$PUBLIC_IP:3000/health")

          echo "Response: $RESPONSE"

          echo "$RESPONSE" |
            jq -e '.status == "ok"' > /dev/null

          echo "Smoke test passed: HTTP 200 and status ok"

      - name: Stop Fargate after testing
        if: ${{ always() && steps.start_fargate.outcome != 'skipped' }}
        timeout-minutes: 5
        run: |
          aws ecs update-service \
            --cluster pipewright-cluster \
            --service pipewright-app \
            --desired-count 0

          for attempt in $(seq 1 30); do
            COUNTS=$(aws ecs describe-services \
              --cluster pipewright-cluster \
              --services pipewright-app \
              --query 'services[0].[desiredCount,runningCount,pendingCount]' \
              --output text)

            echo "ECS task counts: $COUNTS"

            if [ "$COUNTS" = "$(printf '0\t0\t0')" ]; then
              echo "Cleanup confirmed: ECS has zero tasks."
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: ECS tasks did not reach zero."
          exit 1

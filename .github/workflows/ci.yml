name: CloudPipeline CI

on:
  push:
    branches:
      - main
      - kubernetes-ci-test
    paths:
      - 'app.js'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app.js'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test Node.js and build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t cloudpipeline-app:${{ github.sha }} .


name: CloudPipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t cloudpipeline-app:${{ github.sha }} .

  check-aws-auth:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::349326897252:role/pipewright-github-deploy
          aws-region: eu-central-1
          allowed-account-ids: '349326897252'
          role-session-name: CloudPipelineECRPush
          retry-max-attempts: 2

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: pipewright-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Register new ECS task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/pipewright-app:$IMAGE_TAG"

          aws ecs describe-task-definition \
            --task-definition pipewright-app \
            --query taskDefinition \
            --output json |
          jq --arg IMAGE "$IMAGE" \
            '{
              family,
              executionRoleArn,
              taskRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform
            } | with_entries(select(.value != null)) |
            .containerDefinitions[0].image = $IMAGE' \
            > task-definition-new.json

          aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json

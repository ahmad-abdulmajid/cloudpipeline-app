name: CloudPipeline Deployment Test

on:
  workflow_dispatch:

concurrency:
  group: pipewright-ecs-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployment-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::349326897252:role/pipewright-github-deploy
          aws-region: eu-central-1
          allowed-account-ids: '349326897252'
          role-session-name: CloudPipelineDeploymentTest

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Inspect ECS service
        run: |
          aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].{Status:status,TaskDefinition:taskDefinition,Desired:desiredCount,Running:runningCount,Pending:pendingCount}'

      - name: Check ECS is stopped before testing
        run: |
          COUNTS=$(aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].[desiredCount,runningCount,pendingCount]' \
            --output text)

          if [ "$COUNTS" != "$(printf '0\t0\t0')" ]; then
            echo "ERROR: ECS service is not fully stopped."
            echo "Current counts: $COUNTS"
            exit 1
          fi

          echo "Preflight passed: ECS service is stopped."

      - name: Start one Fargate task
        id: start_fargate
        run: |
          aws ecs update-service \
            --cluster pipewright-cluster \
            --service pipewright-app \
            --desired-count 1 \
            --query 'service.{Desired:desiredCount,TaskDefinition:taskDefinition}'

      - name: Wait for ECS service stability
        timeout-minutes: 10
        run: |
          aws ecs wait services-stable \
            --cluster pipewright-cluster \
            --services pipewright-app

      - name: Find running ECS task
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster pipewright-cluster \
            --service-name pipewright-app \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ERROR: No running ECS task found"
            exit 1
          fi

          echo "Running ECS task: $TASK_ARN"
          echo "TASK_ARN=$TASK_ARN" >> "$GITHUB_ENV"

      - name: Find Fargate public IP
        run: |
          ENI_ID=$(aws ecs describe-tasks \
            --cluster pipewright-cluster \
            --tasks "$TASK_ARN" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
            --output text)

          if [ -z "$ENI_ID" ] || [ "$ENI_ID" = "None" ]; then
            echo "ERROR: No network interface found"
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "ERROR: No public IP found"
            exit 1
          fi

          echo "Public IP: $PUBLIC_IP"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Smoke test application health
        timeout-minutes: 2
        run: |
          echo "Testing application at http://$PUBLIC_IP:3000/health"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --max-time 10 \
            --retry 3 \
            --retry-delay 2 \
            "http://$PUBLIC_IP:3000/health")

          echo "Response: $RESPONSE"

          echo "$RESPONSE" |
            jq -e '.status == "ok"' > /dev/null

          echo "Smoke test passed: HTTP 200 and status ok"

      - name: Stop Fargate after testing
        if: ${{ always() && steps.start_fargate.outcome != 'skipped' }}
        timeout-minutes: 2
        run: |
          aws ecs update-service \
            --cluster pipewright-cluster \
            --service pipewright-app \
            --desired-count 0

          aws ecs wait services-stable \
            --cluster pipewright-cluster \
            --services pipewright-app

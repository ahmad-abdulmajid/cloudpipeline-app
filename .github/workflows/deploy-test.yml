name: CloudPipeline Deployment Test

on:
  workflow_dispatch:

concurrency:
  group: pipewright-ecs-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployment-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::349326897252:role/pipewright-github-deploy
          aws-region: eu-central-1
          allowed-account-ids: '349326897252'
          role-session-name: CloudPipelineDeploymentTest

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Inspect ECS service
        run: |
          aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].{Status:status,TaskDefinition:taskDefinition,Desired:desiredCount,Running:runningCount,Pending:pendingCount}'

      - name: Stop Fargate after testing
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          aws ecs update-service \
            --cluster pipewright-cluster \
            --service pipewright-app \
            --desired-count 0

          aws ecs wait services-stable \
            --cluster pipewright-cluster \
            --services pipewright-app

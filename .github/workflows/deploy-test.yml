name: CloudPipeline Manual ECS Deployment

on:
  workflow_dispatch:

concurrency:
  group: pipewright-ecs-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Docker build
        run: docker build -t cloudpipeline-app:${{ github.sha }} .

  deploy:
    name: Deploy and smoke-test ECS
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::349326897252:role/pipewright-github-deploy
          aws-region: eu-central-1
          allowed-account-ids: '349326897252'
          role-session-name: CloudPipelineManualRelease

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Check ECS is stopped
        run: |
          COUNTS=$(aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].[desiredCount,runningCount,pendingCount]' \
            --output text)

          if [ "$COUNTS" != "$(printf '0\t0\t0')" ]; then
            echo "ERROR: ECS is not fully stopped."
            echo "Current counts: $COUNTS"
            exit 1
          fi

          echo "ECS preflight passed."

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: pipewright-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Register new ECS task definition
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF" \
            --query taskDefinition \
            --output json |
          jq --arg IMAGE "$IMAGE" \
            '{
              family,
              executionRoleArn,
              taskRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform
            } | with_entries(select(.value != null)) |
            .containerDefinitions[0].image = $IMAGE' \
            > task-definition-new.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEFINITION_ARN=$NEW_TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster pipewright-cluster \
            --service pipewright-app \
            --task-definition "$TASK_DEFINITION_ARN" \
            --desired-count 0

      - name: Verify deployed image
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].taskDefinition' \
            --output text)

          DEPLOYED_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)

          if [ "$DEPLOYED_IMAGE" != "$IMAGE" ]; then
            echo "ERROR: Deployed image does not match release image."
            exit 1
          fi

          echo "Correct release image confirmed."

      - name: Start one Fargate task
        id: start_fargate
        run: |
          aws ecs update-service \
            --cluster pipewright-cluster \
            --service pipewright-app \
            --desired-count 1

      - name: Wait for ECS stability
        timeout-minutes: 10
        run: |
          aws ecs wait services-stable \
            --cluster pipewright-cluster \
            --services pipewright-app

      - name: Confirm expected task definition is running
        run: |
          ACTUAL_TASK_DEF=$(aws ecs describe-services \
            --cluster pipewright-cluster \
            --services pipewright-app \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ "$ACTUAL_TASK_DEF" != "$TASK_DEFINITION_ARN" ]; then
            echo "ERROR: ECS is not using the expected task definition."
            echo "The deployment may have rolled back."
            exit 1
          fi

          echo "Expected task definition confirmed."

      - name: Find running ECS task
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster pipewright-cluster \
            --service-name pipewright-app \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ERROR: No running ECS task found."
            exit 1
          fi

          echo "TASK_ARN=$TASK_ARN" >> "$GITHUB_ENV"
      - name: Verify running task revision
        run: |
          RUNNING_TASK_DEF=$(aws ecs describe-tasks \
            --cluster pipewright-cluster \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].taskDefinitionArn' \
            --output text)

          if [ "$RUNNING_TASK_DEF" != "$TASK_DEFINITION_ARN" ]; then
            echo "ERROR: Running task uses the wrong task definition."
            echo "Expected: $TASK_DEFINITION_ARN"
            echo "Actual: $RUNNING_TASK_DEF"
            exit 1
          fi

          echo "Running task uses the expected revision."
      - name: Find Fargate public IP
        run: |
          ENI_ID=$(aws ecs describe-tasks \
            --cluster pipewright-cluster \
            --tasks "$TASK_ARN" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
            --output text)

          if [ -z "$ENI_ID" ] || [ "$ENI_ID" = "None" ]; then
            echo "ERROR: No network interface found."
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "ERROR: No public IP found."
            exit 1
          fi

          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Smoke test application health
        timeout-minutes: 2
        run: |
          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --max-time 10 \
            --retry 3 \
            --retry-delay 2 \
            "http://$PUBLIC_IP:3000/health")

          echo "Response: $RESPONSE"

          echo "$RESPONSE" |
            jq -e '.status == "ok"' > /dev/null

          echo "Smoke test passed."

      - name: Stop Fargate after testing
        if: ${{ always() && (steps.start_fargate.outcome == 'success' || steps.start_fargate.outcome == 'failure') }}
        timeout-minutes: 5
        run: |
          aws ecs update-service \
            --cluster pipewright-cluster \
            --service pipewright-app \
            --desired-count 0

          for attempt in $(seq 1 30); do
            echo "Retry attempt: $attempt"
            COUNTS=$(aws ecs describe-services \
              --cluster pipewright-cluster \
              --services pipewright-app \
              --query 'services[0].[desiredCount,runningCount,pendingCount]' \
              --output text)

            echo "ECS task counts: $COUNTS"

            if [ "$COUNTS" = "$(printf '0\t0\t0')" ]; then
              echo "Cleanup confirmed: ECS has zero tasks."
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: ECS tasks did not reach zero."
          exit 1

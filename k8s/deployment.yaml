
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpipeline-app
  namespace: cloudpipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpipeline
  template:
    metadata:
      labels:
        app: cloudpipeline
    spec:
      containers:
        - name: cloudpipeline-app
          image: cloudpipeline-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000


apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpipeline-app
  namespace: cloudpipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpipeline
  template:
    metadata:
      labels:
        app: cloudpipeline
    spec:
      containers:
        - name: cloudpipeline-app
          image: cloudpipeline-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
